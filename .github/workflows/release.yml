name: Release macOS Universal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Pomo
  BIN_NAME: pomo

jobs:
  build-macos-universal:
    name: Build Universal macOS CLI & .app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchains (Apple Silicon & Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build Apple Silicon (arm64) release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel (x86_64) release binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal binary via lipo
        run: |
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/${BIN_NAME} \
            target/x86_64-apple-darwin/release/${BIN_NAME} \
            -output target/universal/release/${BIN_NAME}
          chmod +x target/universal/release/${BIN_NAME}
          lipo -info target/universal/release/${BIN_NAME}

      - name: Build Pomo.app bundle and inject Universal binary
        run: |
          cargo bundle --release --format osx
          cp target/universal/release/${BIN_NAME} \
            "target/release/bundle/osx/${APP_NAME}.app/Contents/MacOS/${BIN_NAME}"
          codesign --force --deep --sign - \
            "target/release/bundle/osx/${APP_NAME}.app"

      - name: Package release archives and checksums
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"

          # 1. Standalone Universal CLI tarball
          tar -czf "dist/${BIN_NAME}-${VERSION}-universal-apple-darwin.tar.gz" \
            -C target/universal/release "${BIN_NAME}"

          # 2. Universal macOS .app zip (ditto preserves macOS resource forks & symlinks)
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/bundle/osx/${APP_NAME}.app" \
            "dist/${APP_NAME}-${VERSION}-universal-macos.zip"

          # 3. Generate SHA-256 checksums (useful for Homebrew formulas/casks)
          cd dist
          shasum -a 256 * > checksums-sha256.txt

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ env.BIN_NAME }}-${{ github.ref_name }}-universal-apple-darwin.tar.gz
            dist/${{ env.APP_NAME }}-${{ github.ref_name }}-universal-macos.zip
            dist/checksums-sha256.txt